
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Baxter: Controle total com inteligência artificial operacional para decisões críticas e análise global.">
    <title>BAXTER | CONTROLE TOTAL</title>
    <style>
        /* Reset e base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #FFFFFF;
            overflow-x: hidden;
            cursor: none; /* Esconde cursor padrão para efeito customizado */
        }
        html {
            scroll-behavior: smooth;
        }

        /* Cursor customizado com distorsão sutil */
        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(42, 107, 255, 0.5) 0%, rgba(139, 42, 255, 0.5) 100%);
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
        }
        .cursor::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(42, 107, 255, 0.2);
            transform: scale(0);
            transition: transform 0.1s ease;
        }
        .cursor:hover::before {
            transform: scale(1.5);
        }

        /* Animação de entrada */
        .intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeOut 0.5s ease-in-out 2s forwards;
        }
        .line {
            width: 0;
            height: 2px;
            background: linear-gradient(to right, #2A6BFF, #8B2AFF);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: drawLine 0.5s ease-in-out 0.5s forwards, formSymbol 1s ease-in-out 1s forwards;
        }
        .symbol {
            opacity: 0;
            animation: appear 0.5s ease-in-out 2s forwards;
        }
        .brand {
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.5s ease-in-out 2.5s forwards;
        }
        .brand h1 {
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: 0.1em;
        }
        .brand p {
            font-size: 1.5rem;
            font-weight: 200;
            letter-spacing: 0.2em;
            margin-top: 0.5rem;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            opacity: 0;
            animation: fadeIn 0.5s ease-in-out 3s forwards;
            background: rgba(0, 0, 0, 0.8); /* Semi-transparent for overlay */
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.1em;
        }
        nav {
            display: flex; /* Visível em desktop */
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }
        nav a {
            text-decoration: none;
            color: #FFFFFF;
            font-size: 1rem;
            font-weight: 300;
            position: relative;
            transition: color 0.3s ease;
        }
        nav a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: linear-gradient(to right, #2A6BFF, #8B2AFF);
            transition: width 0.3s ease;
        }
        nav a:hover::after, nav a:focus::after {
            width: 100%;
        }

        /* Hambúrguer Menu */
        .hamburger {
            display: none; /* Oculto por padrão */
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 20px;
            cursor: pointer;
            padding: 5px;
            border: none;
            background: transparent;
            position: relative;
        }
        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, #2A6BFF, #8B2AFF);
            border-radius: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 3px rgba(42, 107, 255, 0.3); /* Brilho sutil para sofisticação */
        }
        .hamburger.open span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.open span:nth-child(2) {
            transform: rotate(-45deg) translate(7px, -6px);
        }

        /* Overlay do Menu Mobile */
        .nav-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 150;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .nav-overlay ul {
            list-style: none;
            text-align: center;
        }
        .nav-overlay li {
            margin: 1rem 0;
        }
        .nav-overlay a {
            font-size: 1.5rem;
            color: #FFFFFF;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .nav-overlay a:hover, .nav-overlay a:focus {
            color: #2A6BFF;
        }

        /* Seções gerais */
        section {
            min-height: 100vh;
            padding: 5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        section h2 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }
        section p {
            font-size: 1.2rem;
            font-weight: 200;
            max-width: 800px;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero-symbol {
            width: 200px;
            height: 200px;
            position: relative;
            margin-bottom: 2rem;
        }
        .hero-symbol::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(#2A6BFF, #8B2AFF, #2A6BFF);
            animation: rotate 10s linear infinite;
            mask: radial-gradient(circle at center, transparent 48%, black 49%, black 51%, transparent 52%);
            -webkit-mask: radial-gradient(circle at center, transparent 48%, black 49%, black 51%, transparent 52%);
            filter: drop-shadow(0 0 5px rgba(42, 107, 255, 0.3));
        }
        .hero h2 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.2rem;
            font-weight: 200;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            padding: 1rem 2rem;
            border: 1px solid #2A6BFF;
            background: transparent;
            color: #FFFFFF;
            font-size: 1rem;
            font-weight: 300;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover, .btn:focus {
            background: linear-gradient(to right, #2A6BFF, #8B2AFF);
            box-shadow: 0 0 20px rgba(42, 107, 255, 0.5);
            outline: none;
        }

        /* Modal para ativação */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #111;
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
        }
        .modal-content h3 {
            margin-bottom: 1rem;
        }
        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
        }

        /* Partículas sutis */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(42, 107, 255, 0.3);
            border-radius: 50%;
            animation: float 10s linear infinite;
        }
        .particle:nth-child(odd) {
            background: rgba(139, 42, 255, 0.3);
        }

        /* Footer */
        footer {
            padding: 2rem;
            text-align: center;
            background: #111;
        }

        /* Animações */
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
        @keyframes drawLine {
            to { width: 200px; }
        }
        @keyframes formSymbol {
            to { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); } /* Forma uma estrela aproximada */
        }
        @keyframes appear {
            to { opacity: 1; }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); }
            100% { transform: translateY(-100vh) translateX(100px); }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .brand h1 { font-size: 2.5rem; }
            .brand p { font-size: 1rem; }
            .hero h2 { font-size: 2rem; }
            .hero p { font-size: 1rem; }
            nav { display: none; } /* Esconde nav em mobile */
            .hamburger { display: flex; } /* Mostra hambúrguer */
            section h2 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <!-- Animação de entrada -->
    <div class="intro">
        <div class="line"></div>
        <div class="symbol">
            <div class="brand">
                <h1>BAXTER</h1>
                <p>CONTROLE TOTAL</p>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">BAXTER</div>
        <nav>
            <ul>
                <li><a href="#tecnologia">Tecnologia</a></li>
                <li><a href="#plataforma">Plataforma</a></li>
                <li><a href="#seguranca">Segurança</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
        <!-- Hambúrguer Menu -->
        <button class="hamburger" aria-label="Abrir menu" aria-expanded="false">
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- Overlay do Menu Mobile -->
    <div class="nav-overlay">
        <ul>
            <li><a href="#tecnologia">Tecnologia</a></li>
            <li><a href="#plataforma">Plataforma</a></li>
            <li><a href="#seguranca">Segurança</a></li>
            <li><a href="#contato">Contato</a></li>
        </ul>
    </div>

    
    

    <!-- SCRIPT DO HAMBÚRGUER -->
    <script>
        const hamburger = document.querySelector('.hamburger');
        const navOverlay = document.querySelector('.nav-overlay');

        hamburger.addEventListener('click', () => {
            const isOpen = hamburger.classList.toggle('open');
            hamburger.setAttribute('aria-expanded', isOpen);
            navOverlay.style.display = isOpen ? 'flex' : 'none';
        });

        document.querySelectorAll('.nav-overlay a').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('open');
                hamburger.setAttribute('aria-expanded', "false");
                navOverlay.style.display = 'none';
            });
        });
    </script>
</body>
</html>
